name: CI

on:
    push:
        branches: [master]
    pull_request:
        branches: [master]
    workflow_dispatch:

# A newer push to the same branch supersedes the run in flight; master is never
# cancelled, so the badge always reflects a completed run.
concurrency:
    group: ci-${{ github.ref }}
    cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
    test:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7

            - name: Install pnpm
              uses: pnpm/action-setup@v6

            - name: Setup Node.js
              uses: actions/setup-node@v7
              with:
                  node-version: 22
                  cache: 'pnpm'

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Type check
              run: pnpm typecheck

            # Under coverage, so the report comes from the same run that gates
            # the merge rather than a second one that could disagree.
            - name: Run tests
              run: pnpm test:coverage

            # Last, because a build that fails after green tests is a packaging
            # problem, and the distinction is worth keeping in the log.
            - name: Build
              run: pnpm build

            # Non-blocking: a Codecov outage should not turn a green suite red.
            - name: Upload coverage to Codecov
              uses: codecov/codecov-action@v5
              continue-on-error: true
              with:
                  token: ${{ secrets.CODECOV_TOKEN }}
                  files: ./coverage/lcov.info
